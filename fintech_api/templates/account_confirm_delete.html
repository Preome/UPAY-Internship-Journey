<!DOCTYPE html>
<html>
<head>
    <title>Delete Account</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .warning { background: #fff3cd; padding: 20px; border-radius: 5px; border: 1px solid #ffc107; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; }
        .confirm { background: #dc3545; color: #fff; border: none; }
        .cancel { background: #6c757d; color: #fff; border: none; }
    </style>
</head>
<body>
    <div class="warning">
        <h1>Delete Account</h1>
        <p>Are you sure you want to delete account <strong>{{ object.account_number }}</strong>?</p>
        <p>Type: {{ object.account_type }} | Balance: ${{ object.balance }}</p>
        <p><strong>This action cannot be undone.</strong></p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="confirm">Confirm Delete</button>
        <a href="{% url 'django_account_list' %}"><button type="button" class="cancel">Cancel</button></a>
    </form>
</body>
</html>
