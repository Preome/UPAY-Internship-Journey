<!DOCTYPE html>
<html>
<head>
    <title>{% if object %}Edit Account{% else %}Create Account{% endif %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; background: #007bff; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>{% if object %}Edit Account{% else %}Create Account{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if object %}Update{% else %}Create{% endif %}</button>
    </form>
    <p><a href="{% url 'django_account_list' %}">Back to list</a></p>
</body>
</html>
