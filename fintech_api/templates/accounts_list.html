<!DOCTYPE html>
<html>
<head>
    <title>Account List</title>
</head>
<body>
    <h1>Accounts</h1>
    <p>Total Balance: ${{ total_balance }}</p>
    <ul>
    {% for account in accounts %}
        <li>{{ account.account_number }} - ${{ account.balance }}</li>
    {% empty %}
        <li>No accounts found.</li>
    {% endfor %}
    </ul>
</body>
</html>
